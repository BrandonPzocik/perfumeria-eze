<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bottle" x1="100" y1="40" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="cap" x1="100" y1="20" x2="100" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="78" y="28" width="44" height="18" rx="4" fill="url(#cap)"/>
    <rect x="86" y="14" width="28" height="18" rx="3" fill="#1E40AF"/>
    <rect x="62" y="46" width="76" height="130" rx="14" fill="url(#bottle)"/>
    <rect x="62" y="46" width="76" height="130" rx="14" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>
    <rect x="78" y="100" width="44" height="28" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="84" y="108" width="32" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="84" y="115" width="24" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>
